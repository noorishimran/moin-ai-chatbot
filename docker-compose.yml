services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moin_chatbot
    ports:
      - "5432:5432"
    volumes:
      - moin_pg_data:/var/lib/postgresql/data

volumes:
  moin_pg_data: